name: Bug report
description: Report broken or unexpected behavior on wuwa-optimizer.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, account identifiers, or other private information.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Homepage
        - Build Scorer
        - Build Import / OCR
        - Team Simulator
        - Character Guides
        - Rotations
        - Profile and Builds
        - Authentication
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page URL
      description: Copy the URL of the page where the problem occurred.
      placeholder: https://wuwa-optimizer.com/...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: Explain what happened. You can also add screenshots or a short video.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same report.
          required: true
        - label: I removed private account information from the report and attachments.
          required: true
