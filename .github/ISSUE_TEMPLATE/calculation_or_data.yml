name: Incorrect calculation or data
description: Report an incorrect value, effect, timing, score or game data entry.
title: "[Data/Calculation]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report a wrong value or calculation here. Include the configuration needed to reproduce it.

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Team damage calculation
        - Character or skill data
        - Weapon data or effect
        - Echo or Sonata data or effect
        - Rotation or action timing
        - Negative status or combat mechanic
        - Build score
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://wuwa-optimizer.com/...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: Include the character or team, selected equipment and the result that appears incorrect. You can also add screenshots or sources.
      placeholder: |
        Character or team:
        Equipment:
        What looks wrong:
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same report.
          required: true
        - label: I removed private account information from the report and attachments.
          required: true
