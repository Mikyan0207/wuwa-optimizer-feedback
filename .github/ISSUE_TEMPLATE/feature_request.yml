name: Feature request
description: Propose a change or new feature for wuwa-optimizer.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Build Scorer
        - Build Import / OCR
        - Team Simulator
        - Character Guides
        - Rotations
        - Profile and Builds
        - Accessibility or localization
        - New area
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe what is currently difficult, missing or repetitive.
      placeholder: I cannot currently...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work from the user's point of view.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example or mockup
      description: Add an example, screenshot or sketch if needed.

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Explain how you handle the problem today, if applicable.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true
        - label: I explained the user problem or use case behind this request.
          required: true
