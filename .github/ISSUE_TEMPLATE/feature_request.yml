name: Feature request
description: Propose a change or new feature for wuwa-optimizer.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Build Scorer
        - Build Import / OCR
        - Team Simulator
        - Character Guides
        - Rotations
        - Profile and Builds
        - Accessibility or localization
        - New area
        - Other
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Describe your idea
      description: Explain what you would like to see and why it would be useful. You can also add screenshots or examples.
      placeholder: I would like to...
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true
        - label: I explained the user problem or use case behind this request.
          required: true
